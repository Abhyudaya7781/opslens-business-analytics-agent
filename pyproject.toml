[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opslens"
version = "0.1.0"
description = "Evidence-backed investigation for sales and operations data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0,<1.0.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
